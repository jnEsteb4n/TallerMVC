<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="auth-page">
<main class="auth">
    <section class="auth-aside">
        <span class="brand-mark brand-mark-lg" aria-hidden="true"></span>
        <h1>Alpha</h1>
        <p>Las cuentas nuevas empiezan con el rol USER. Un administrador puede darte más acceso después.</p>
    </section>

    <section class="auth-panel">
        <h2>Crear cuenta</h2>

        <p th:if="${error}" th:text="${error}" class="alert alert-error" role="alert"></p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form" novalidate>
            <div class="field">
                <label for="fullName">Nombre completo</label>
                <input type="text" th:field="*{fullName}" th:errorclass="is-invalid" autocomplete="name">
                <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>
            <div class="field">
                <label for="email">Correo institucional</label>
                <input type="email" th:field="*{email}" th:errorclass="is-invalid" autocomplete="email"
                       placeholder="nombre@u.icesi.edu.co">
                <p class="field-hint">Debe terminar en @u.icesi.edu.co.</p>
                <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="field">
                <label for="academicProgram">Programa académico (opcional)</label>
                <input type="text" th:field="*{academicProgram}" th:errorclass="is-invalid">
                <p class="field-error" th:if="${#fields.hasErrors('academicProgram')}" th:errors="*{academicProgram}"></p>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" th:field="*{password}" th:errorclass="is-invalid" autocomplete="new-password">
                <p class="field-hint">Mínimo 8 caracteres.</p>
                <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
            <div class="field">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" th:field="*{confirmPassword}" th:errorclass="is-invalid" autocomplete="new-password">
                <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
        </form>

        <p class="auth-switch">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </section>
</main>
</body>
</html>
